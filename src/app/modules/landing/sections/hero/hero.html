<section class="hero">
  <div class="hero-decor decor-1"></div>
  <div class="hero-decor decor-2"></div>
  <div class="hero-decor decor-3"></div>

  <div class="container-xl hero-container">
    <div class="row align-items-center g-5">
      <div class="col-lg-6">
        <div class="hero-copy">
          <span class="hero-eyebrow"><i class="bi bi-heart-fill me-2"></i>Trusted Matrimonial Service</span>
          <h1 class="hero-title">
            {{ title }}
          </h1>
          <p class="hero-subtitle">{{ subtitle }}</p>
          <div class="hero-actions">
            <a routerLink="/browse" class="btn btn-primary-custom btn-lg">{{ primaryBtn }}</a>
            <a routerLink="/register" class="btn btn-secondary-custom btn-lg">{{ secondaryBtn }}</a>
          </div>
          <div class="hero-trust">
            <div class="trust-avatars">
              <span class="ta" style="background:#7b1e3a">A</span>
              <span class="ta" style="background:#a03154">D</span>
              <span class="ta" style="background:#c9a227">K</span>
              <span class="ta" style="background:#6b4b7c">M</span>
              <span class="ta ta-plus">+</span>
            </div>
            <div class="trust-copy">
              <span class="stars"><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i></span>
              <span class="trust-note">Trusted by 1,200+ families across India</span>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-6">
        <div class="hero-visual">
          <div class="visual-frame">
            <div class="frame-person person-main">
              <div class="ph-circle"></div>
              <div class="ph-body"></div>
            </div>
            <div class="frame-person person-small">
              <div class="ph-circle"></div>
              <div class="ph-body"></div>
            </div>
            <div class="frame-heart"><i class="bi bi-heart-fill"></i></div>
            <div class="visual-card card-top">
              <span class="vc-icon"><i class="bi bi-shield-check"></i></span>
              <span><strong>Verified Profiles</strong><small>100% admin checked</small></span>
            </div>
            <div class="visual-card card-bottom">
              <span class="vc-icon gold"><i class="bi bi-award"></i></span>
              <span><strong>1,200+ Connections</strong><small>Happy families</small></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
