<div class="saved-page">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0">Saved Profiles</h4>
    <a routerLink="/browse" class="btn btn-soft btn-sm"><i class="bi bi-plus-lg me-1"></i>Browse More</a>
  </div>

  @if (loading) {
    <div class="row g-4">
      @for (i of [1, 2, 3, 4]; track i) {
        <div class="col-6 col-md-4 col-lg-3">
          <div class="skeleton-card">
            <div class="skeleton" style="aspect-ratio: 1/1.05; border-radius: 14px 14px 0 0"></div>
            <div class="p-3">
              <div class="skeleton mb-2" style="height: 14px; width: 60%"></div>
              <div class="skeleton mb-2" style="height: 12px"></div>
              <div class="skeleton" style="height: 12px; width: 80%"></div>
            </div>
          </div>
        </div>
      }
    </div>
  } @else if (error) {
    <app-empty-state
      [title]="'Something went wrong'"
      [message]="error"
      [icon]="'bi-exclamation-triangle'"
      (action)="load()"
    ></app-empty-state>
  } @else if (!profiles.length) {
    <app-empty-state
      [title]="'No saved profiles yet'"
      [message]="'Profiles you save will appear here for quick access.'"
      [icon]="'bi-heart'"
      [actionLabel]="'Browse Profiles'"
      (action)="goBrowse()"
    ></app-empty-state>
  } @else {
    <div class="row g-4">
      @for (profile of profiles; track profile._id) {
        <div class="col-6 col-md-4 col-lg-3">
          <app-profile-card [profile]="profile" [showActions]="false"></app-profile-card>
          <div class="mt-2 text-center">
            <button class="btn btn-sm btn-outline-danger" (click)="remove(profile)">
              <i class="bi bi-trash me-1"></i> Remove
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>
